<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BW Transit Map</title>

<!-- Leaflet's stylesheet -- required for the map to render correctly
     (controls, markers, zoom buttons all depend on this CSS) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  /* the map needs an element with an explicit height to render into --
     without this, Leaflet has a <div> with zero height and shows nothing */
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { height: 100vh; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet's JavaScript library itself -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // L is the global object Leaflet's script tag creates -- everything
  // Leaflet gives you hangs off of it.
  //
  // L.map('map') looks for the element with id="map" (the <div> above)
  // and turns it into an interactive map.
  //
  // .setView([lat, lon], zoomLevel) centers the map. 48.6, 9.2 is roughly
  // the geographic center of Baden-Württemberg; zoom 8 is far enough
  // zoomed out to see most of the state at once (higher number = closer).
  const map = L.map('map').setView([48.6, 9.2], 8);

  // A map with no tiles is just an empty grey rectangle -- tiles are the
  // actual visual map images (roads, place names, terrain). This loads
  // them from OpenStreetMap's free tile servers.
  //
  // {s}, {z}, {x}, {y} are placeholders Leaflet fills in automatically:
  // {s} picks a load-balancing subdomain, {z} is zoom level, {x}/{y}
  // are the tile's grid position. You never touch these yourself.
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    // OpenStreetMap's usage policy requires this attribution to be
    // visible on the map -- it's not optional, it's a license condition
    // of using their free tiles.
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);  // .addTo(map) is what actually puts this layer onto the map
</script>

</body>
</html>
